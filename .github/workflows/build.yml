name: App Build

on:
  push:
    branches:
      - canary
      - nightly
      - beta
      - release
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Signed APK
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Extract Channel from BuildConfig
        id: get_channel
        run: |
          RAW_CHANNEL=$(grep 'buildConfigField("String", "CHANNEL"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"CHANNEL",\s*"([^"]+)".*/\1/')
          CHANNEL=$(echo "$RAW_CHANNEL" | tr '[:upper:]' '[:lower:]')

          if [ -z "$CHANNEL" ]; then
            echo "❌ ОШИБКА: Не удалось найти CHANNEL в app/build.gradle.kts"
            exit 1
          fi

          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          CHANNEL_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${CHANNEL:0:1})${CHANNEL:1}"
          echo "CHANNEL_CAP=$CHANNEL_CAP" >> $GITHUB_ENV
          echo "Extracted CHANNEL from app/build.gradle.kts: $CHANNEL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          CHANGELOG=$(git log -1 --pretty=format:"%s" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Tests and Build Signed Release APK
        run: |
          ./gradlew testDebugUnitTest :app:assembleRelease \
            -PCHANNEL="${{ env.CHANNEL }}" \
            -PcommitId="${{ steps.commit.outputs.commit_id }}" \
            -PKEYSTORE_BASE64="${{ secrets.KEYSTORE_BASE64 }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --parallel \
            --build-cache

      - name: Prepare & Rename Signed APK
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="iposstore-${CHANNEL}-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/release/$APK_NAME"

          if [ -f "$APK_SRC" ]; then
            mv "$APK_SRC" "$APK_DEST"
          else
            FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              mv "$FOUND_APK" "$APK_DEST"
            fi
          fi

          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK Path: $APK_DEST"

      - name: Upload APK to Custom Updater API
        env:
          SERVER_URL: ${{ secrets.UPDATER_SERVER_URL }}
          API_KEY: ${{ secrets.UPDATER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          CHANGELOG_TEXT: ${{ steps.commit.outputs.changelog }}
        run: |
          SERVER_URL_CLEAN="${SERVER_URL%/}"
          if [[ "$SERVER_URL_CLEAN" == http://* ]]; then
            SERVER_URL_CLEAN="https://${SERVER_URL_CLEAN#http://}"
          elif [[ "$SERVER_URL_CLEAN" != https://* ]]; then
            SERVER_URL_CLEAN="https://$SERVER_URL_CLEAN"
          fi

          RESPONSE_FILE="${RUNNER_TEMP}/response.json"

          echo "Uploading $APK_PATH to $SERVER_URL_CLEAN/api/upload (Channel: $CHANNEL)..."
          
          HTTP_STATUS=$(curl -sS -L --post301 --post302 -o "$RESPONSE_FILE" -w "%{http_code}" \
            -A "IposStore-CI-Bot/1.0" \
            -X POST "$SERVER_URL_CLEAN/api/upload" \
            -H "X-API-Key: $API_KEY" \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            -F "file=@${APK_PATH}" \
            -F "channel=${CHANNEL}" \
            -F "changelog=${CHANGELOG_TEXT}" || echo "000")
            
          echo "Server HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Успешно загружено на сервер обновлений!"
            if [ -f "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            fi
          else
            echo "❌ Ошибка загрузки (HTTP Status: $HTTP_STATUS)"
            if [ -f "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            fi
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iposstore-${{ env.CHANNEL }}-${{ steps.commit.outputs.commit_id }}
          path: ${{ env.APK_PATH }}
          retention-days: 7

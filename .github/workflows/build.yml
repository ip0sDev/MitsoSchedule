name: App Build

on:
  push:
    branches:
      - canary
      - nightly
      - beta
      - release
      - main
  workflow_dispatch:

# Сборки одной ветки идут по очереди: уже начатую публикацию релиза не обрываем
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # публикация релизов и тегов

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история и теги: по ним собирается список изменений

      - name: Extract Channel from BuildConfig
        id: get_channel
        run: |
          python3 -c '
          import re, sys

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              content = f.read()

          m = re.search(r"CHANNEL.*\"\\?([a-zA-Z0-9_-]+)", content)
          if not m:
              print("❌ ERROR: Failed to find CHANNEL in app/build.gradle.kts", file=sys.stderr)
              sys.exit(1)

          channel = m.group(1).strip().lower()
          channel_cap = channel.capitalize()

          with open(sys.argv[1], "a", encoding="utf-8") as env_file:
              env_file.write(f"CHANNEL={channel}\n")
              env_file.write(f"CHANNEL_CAP={channel_cap}\n")

          print(f"Extracted CHANNEL: {channel}")
          ' "$GITHUB_ENV"

      - name: Read app and watch versions
        run: |
          read_prop() { grep -E "$2 *=" "$1" | head -n1 | sed -E 's/.*= *"?([^"]*)"?.*/\1/' | tr -d '\r '; }
          echo "APP_VERSION=$(read_prop app/build.gradle.kts versionName)" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(read_prop app/build.gradle.kts versionCode)" >> "$GITHUB_ENV"
          echo "WATCH_VERSION=$(read_prop watchso/build.gradle.kts versionName)" >> "$GITHUB_ENV"
          echo "WATCH_VERSION_CODE=$(read_prop watchso/build.gradle.kts versionCode)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          commit_id=$(git rev-parse --short HEAD)
          echo "commit_id=$commit_id" >> "$GITHUB_ENV"
          echo "commit_id=$commit_id" >> "$GITHUB_OUTPUT"

          raw_changelog=$(git log -1 --pretty=format:"%s")
          changelog=$(echo "$raw_changelog" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Tests and Build Signed Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :core:testDebugUnitTest :app:testDebugUnitTest :watchso:testDebugUnitTest \
            :app:assembleRelease :watchso:assembleRelease \
            "-PCHANNEL=${CHANNEL}" \
            "-PcommitId=${commit_id}" \
            "-PKEYSTORE_BASE64=${KEYSTORE_BASE64}" \
            "-PKEY_ALIAS=${KEY_ALIAS}" \
            "-PKEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" \
            "-PKEY_PASSWORD=${KEY_PASSWORD}" \
            --parallel \
            --build-cache

      - name: Prepare & Rename Signed APKs
        run: |
          pick_apk() {
            # $1 = каталог с APK, $2 = ожидаемое имя из Gradle, $3 = итоговое имя
            local dir="$1" src="$1/$2" dest="$1/$3"
            if [ -f "$src" ]; then
              mv -f "$src" "$dest"
            else
              local found
              found=$(find "$dir" -name "*.apk" | head -n 1)
              if [ -z "$found" ]; then
                echo "❌ ERROR: No APK found in $dir" >&2
                return 1
              fi
              mv -f "$found" "$dest"
            fi
          }

          APK_NAME="iposstore-${CHANNEL}-${commit_id}.apk"
          WATCH_APK_NAME="iposstore-watch-${CHANNEL}-${commit_id}.apk"
          pick_apk app/build/outputs/apk/release app-release.apk "$APK_NAME"
          pick_apk watchso/build/outputs/apk/release watchso-release.apk "$WATCH_APK_NAME"

          echo "APK_PATH=app/build/outputs/apk/release/$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "WATCH_APK_PATH=watchso/build/outputs/apk/release/$WATCH_APK_NAME" >> "$GITHUB_ENV"
          echo "WATCH_APK_NAME=$WATCH_APK_NAME" >> "$GITHUB_ENV"
          ls -la app/build/outputs/apk/release watchso/build/outputs/apk/release

      - name: Collect R8 mapping files
        run: |
          mkdir -p "${RUNNER_TEMP}/mapping/app" "${RUNNER_TEMP}/mapping/watch"
          cp app/build/outputs/mapping/release/mapping.txt "${RUNNER_TEMP}/mapping/app/" || true
          cp watchso/build/outputs/mapping/release/mapping.txt "${RUNNER_TEMP}/mapping/watch/" || true
          echo "MAPPING_DIR=${RUNNER_TEMP}/mapping" >> "$GITHUB_ENV"

      - name: Build release notes
        run: |
          # Предыдущий релиз: ближайший тег v* в истории; без него берём три последних коммита
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            SINCE="с релиза ${PREV_TAG}"
          else
            RANGE="-3"
            SINCE="последние коммиты"
          fi

          {
            echo "## Что нового (${SINCE})"
            echo
            # заголовок коммита как подзаголовок, тело как есть; служебные строки не показываем,
            # а «-текст» (стиль коммитов репозитория) превращаем в «- текст», иначе GitHub не рисует список
            git log ${RANGE} --no-merges --pretty=format:'### %s%n%n%b%n' \
              | grep -viE '^(Co-Authored-By|Signed-off-by):' \
              | sed -E 's/^-([^ -])/- \1/' \
              | cat -s
            echo
            echo "---"
            echo "**Приложение:** ${APP_VERSION} (${APP_VERSION_CODE}) · **Часы:** ${WATCH_VERSION} (${WATCH_VERSION_CODE})"
            echo
            echo "**Канал:** \`${CHANNEL}\` · **Ветка:** \`${GITHUB_REF_NAME}\` · **Коммит:** \`${commit_id}\` · **Сборка:** #${GITHUB_RUN_NUMBER}"
            echo
            echo "### Файлы"
            echo "- \`${APK_NAME}\`: телефон (Android 12+)"
            echo "- \`${WATCH_APK_NAME}\`: часы (Wear OS 5+)"
            echo "- \`SHA256SUMS.txt\`: контрольные суммы"
          } > "${RUNNER_TEMP}/release_notes.md"

          # у GitHub предел на длину описания
          head -c 100000 "${RUNNER_TEMP}/release_notes.md" > "${RUNNER_TEMP}/release_notes_trimmed.md"
          mv "${RUNNER_TEMP}/release_notes_trimmed.md" "${RUNNER_TEMP}/release_notes.md"
          echo "NOTES_FILE=${RUNNER_TEMP}/release_notes.md" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ Ключ подписи не задан: APK не подписаны, релиз не публикуется."
            exit 0
          fi

          TAG="v${APP_VERSION}-b${GITHUB_RUN_NUMBER}"
          TITLE="МИТСО Расписание ${APP_VERSION} (сборка ${GITHUB_RUN_NUMBER}, ${CHANNEL})"

          (cd app/build/outputs/apk/release && sha256sum "$APK_NAME") > "${RUNNER_TEMP}/SHA256SUMS.txt"
          (cd watchso/build/outputs/apk/release && sha256sum "$WATCH_APK_NAME") >> "${RUNNER_TEMP}/SHA256SUMS.txt"

          # Стабильный релиз только из ветки release, остальные каналы помечаются как пред-релиз
          if [ "$GITHUB_REF_NAME" = "release" ]; then
            FLAGS="--latest"
          else
            FLAGS="--prerelease"
          fi

          gh release create "$TAG" \
            "$APK_PATH" "$WATCH_APK_PATH" "${RUNNER_TEMP}/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            $FLAGS

          echo "✅ Релиз опубликован: $TAG"

      - name: Upload APK to Custom Updater API
        env:
          SERVER_URL: ${{ secrets.UPDATER_SERVER_URL }}
          API_KEY: ${{ secrets.UPDATER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          CHANGELOG_TEXT: ${{ steps.commit.outputs.changelog }}
        run: |
          SERVER_URL="${SERVER_URL%/}"
          if [[ ! "$SERVER_URL" =~ ^https?:// ]]; then
            SERVER_URL="https://$SERVER_URL"
          fi

          UPLOAD_URL="${SERVER_URL}/api/upload"
          RESPONSE_FILE="${RUNNER_TEMP}/response.json"

          echo "Uploading $APK_PATH to $UPLOAD_URL (Channel: $CHANNEL)..."

          CURL_ARGS=(
            -sS
            -L
            --post301
            --post302
            -o "$RESPONSE_FILE"
            -w "%{http_code}"
            -H "X-API-Key: ${API_KEY}"
            -H "User-Agent: IposStore-CI-Bot/1.0"
          )

          if [ -n "$CF_CLIENT_ID" ]; then
            CURL_ARGS+=(-H "CF-Access-Client-Id: ${CF_CLIENT_ID}")
          fi

          if [ -n "$CF_CLIENT_SECRET" ]; then
            CURL_ARGS+=(-H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}")
          fi

          HTTP_STATUS=$(curl "${CURL_ARGS[@]}" \
            -F "file=@${APK_PATH}" \
            -F "channel=${CHANNEL}" \
            -F "changelog=${CHANGELOG_TEXT}" \
            "$UPLOAD_URL")

          echo "Server HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Successfully uploaded to update server!"
            [ -f "$RESPONSE_FILE" ] && cat "$RESPONSE_FILE"
          else
            echo "❌ Upload failed with HTTP Status: $HTTP_STATUS" >&2
            [ -f "$RESPONSE_FILE" ] && cat "$RESPONSE_FILE"
            exit 1
          fi

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iposstore-${{ env.CHANNEL }}-${{ env.commit_id }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.WATCH_APK_PATH }}
          retention-days: 7

      # Нужен для расшифровки крашей: без него стек-трейсы из релиза нечитаемы
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.CHANNEL }}-${{ env.commit_id }}
          path: ${{ env.MAPPING_DIR }}
          retention-days: 90

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ env.commit_id }}
          path: |
            core/build/reports/tests
            app/build/reports/tests
            watchso/build/reports/tests
          retention-days: 14
          if-no-files-found: ignore

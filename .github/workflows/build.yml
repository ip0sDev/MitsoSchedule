name: App Build

on:
  push:
    branches:
      - canary
      - nightly
      - beta
      - release
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Extract Channel from BuildConfig
        id: get_channel
        run: |
          python3 -c '
          import re, sys

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              content = f.read()

          m = re.search(r"CHANNEL.*\"\\?([a-zA-Z0-9_-]+)", content)
          if not m:
              print("❌ ERROR: Failed to find CHANNEL in app/build.gradle.kts", file=sys.stderr)
              sys.exit(1)

          channel = m.group(1).strip().lower()
          channel_cap = channel.capitalize()

          with open(sys.argv[1], "a", encoding="utf-8") as env_file:
              env_file.write(f"CHANNEL={channel}\n")
              env_file.write(f"CHANNEL_CAP={channel_cap}\n")

          print(f"Extracted CHANNEL: {channel}")
          ' "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          commit_id=$(git rev-parse --short HEAD)
          echo "commit_id=$commit_id" >> "$GITHUB_ENV"
          echo "commit_id=$commit_id" >> "$GITHUB_OUTPUT"

          raw_changelog=$(git log -1 --pretty=format:"%s")
          changelog=$(echo "$raw_changelog" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Tests and Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            "-PCHANNEL=${CHANNEL}" \
            "-PcommitId=${commit_id}" \
            "-PKEYSTORE_BASE64=${KEYSTORE_BASE64}" \
            "-PKEY_ALIAS=${KEY_ALIAS}" \
            "-PKEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" \
            "-PKEY_PASSWORD=${KEY_PASSWORD}" \
            --parallel \
            --build-cache

      - name: Prepare & Rename Signed APK
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="iposstore-${CHANNEL}-${commit_id}.apk"
          APK_DEST="app/build/outputs/apk/release/${APK_NAME}"

          if [ -f "$APK_SRC" ]; then
            mv -f "$APK_SRC" "$APK_DEST"
          else
            FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              mv -f "$FOUND_APK" "$APK_DEST"
            else
              echo "❌ ERROR: No APK found in app/build/outputs/apk/release" >&2
              exit 1
            fi
          fi

          echo "APK_PATH=$APK_DEST" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK Path: $APK_DEST"

      - name: Upload APK to Custom Updater API
        env:
          SERVER_URL: ${{ secrets.UPDATER_SERVER_URL }}
          API_KEY: ${{ secrets.UPDATER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          CHANGELOG_TEXT: ${{ steps.commit.outputs.changelog }}
        run: |
          SERVER_URL="${SERVER_URL%/}"
          if [[ ! "$SERVER_URL" =~ ^https?:// ]]; then
            SERVER_URL="https://$SERVER_URL"
          fi

          UPLOAD_URL="${SERVER_URL}/api/upload"
          RESPONSE_FILE="${RUNNER_TEMP}/response.json"

          echo "Uploading $APK_PATH to $UPLOAD_URL (Channel: $CHANNEL)..."

          CURL_ARGS=(
            -sS
            -L
            --post301
            --post302
            -o "$RESPONSE_FILE"
            -w "%{http_code}"
            -H "X-API-Key: ${API_KEY}"
            -H "User-Agent: IposStore-CI-Bot/1.0"
          )

          if [ -n "$CF_CLIENT_ID" ]; then
            CURL_ARGS+=(-H "CF-Access-Client-Id: ${CF_CLIENT_ID}")
          fi

          if [ -n "$CF_CLIENT_SECRET" ]; then
            CURL_ARGS+=(-H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}")
          fi

          HTTP_STATUS=$(curl "${CURL_ARGS[@]}" \
            -F "file=@${APK_PATH}" \
            -F "channel=${CHANNEL}" \
            -F "changelog=${CHANGELOG_TEXT}" \
            "$UPLOAD_URL")

          echo "Server HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Successfully uploaded to update server!"
            [ -f "$RESPONSE_FILE" ] && cat "$RESPONSE_FILE"
          else
            echo "❌ Upload failed with HTTP Status: $HTTP_STATUS" >&2
            [ -f "$RESPONSE_FILE" ] && cat "$RESPONSE_FILE"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iposstore-${{ env.CHANNEL }}-${{ env.commit_id }}
          path: ${{ env.APK_PATH }}
          retention-days: 7